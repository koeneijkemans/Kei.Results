name: PR validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Kei.Results.slnx

      - name: Build
        run: dotnet build Kei.Results.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution Kei.Results.slnx -c Release --no-build
